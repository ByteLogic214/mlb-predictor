name: MLB Daily Predictions

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a predecir (YYYY-MM-DD). Vacío = hoy.'
        required: false
        default: ''
  schedule:
    # 17:00 UTC equivale a las 11:00 AM Hora Central de México (CST)
    - cron: '0 17 * * *'

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: ⚾ Ejecutar predicciones
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            python main.py "${{ github.event.inputs.fecha }}"
          else
            python main.py
          fi
      
      - name: 💾 Commit resultados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ models/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            FECHA=$(date +%Y-%m-%d)
            git commit -m "🤖 Predicciones MLB $FECHA [bot]"
            git push
          fi
